name: Deploy .NET 8 B-Empleo-Dev to VPS

on:
  pull_request:
    branches:
      - develop
    types:
      - closed
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install sshpass (if using password)
        run: |
          echo "Instalando sshpass para autenticación por contraseña..."
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Setup SSH agent (if using key)
        if: ${{ secrets.VPS_SSH_KEY != '' }}
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          echo "Agregando VPS a known_hosts..."
          ssh-keyscan -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          echo "Probando conexión SSH..."
          if [ -n "${{ secrets.VPS_PASSWORD }}" ]; then
            sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "echo Conexión OK"
          else
            ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "echo Conexión OK"
          fi

      - name: Copy project to VPS
        run: |
          echo "Copiando proyecto al VPS..."
          if [ -n "${{ secrets.VPS_PASSWORD }}" ]; then
            sshpass -p "${{ secrets.VPS_PASSWORD }}" rsync -avz --exclude '.git' ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:${{ secrets.VPS_DEPLOY_PATH }}
          else
            rsync -avz --exclude '.git' ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:${{ secrets.VPS_DEPLOY_PATH }}
          fi

      - name: Deploy on VPS
        run: |
          echo "Ejecutando despliegue en VPS..."
          if [ -n "${{ secrets.VPS_PASSWORD }}" ]; then
            sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} << 'EOF'
              cd ${{ secrets.VPS_DEPLOY_PATH }}
              echo "Deteniendo contenedores..."
              docker compose -f docker-compose.dev.yml down || true
              echo "Levantando contenedores..."
              docker compose -f docker-compose.dev.yml up -d --build
            EOF
          else
            ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} << 'EOF'
              cd ${{ secrets.VPS_DEPLOY_PATH }}
              echo "Deteniendo contenedores..."
              docker compose -f docker-compose.dev.yml down || true
              echo "Levantando contenedores..."
              docker compose -f docker-compose.dev.yml up -d --build
            EOF
          fi
